[project]
name = "data8014"
version = "0.1.0"
description = "Semester-long AI research codebase for DATA 8014 (Fall 2026)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.1",
    "psutil>=7.2.2",
    "torch>=2.14.0",
    "torchvision>=0.29.0",
]

[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["data8014"]

[tool.uv]
# PyTorch wheels: pin torch/torchvision to the official cu126 index to
# match the local NVIDIA driver (560.76 -> CUDA 12.6). This is the
# explicit-index equivalent of `uv add torch --torch-backend=auto` for uv
# versions without the torch-backend flag.
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }
